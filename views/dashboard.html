<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freshroots Demand Planning</title>
<style>
  :root { --bg: #f1e8d4; --panel: #f8f2e4; --ink: #111; --muted: #5b5648; --line: #cfc3a6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 28px 0 8px; }
  h3 { font-size: 14px; margin: 18px 0 6px; text-transform: uppercase; letter-spacing: .04em; }
  .muted { color: var(--muted); }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 24px; background: var(--panel); border: 1px solid var(--line); padding: 10px 14px; }
  .meta b { font-weight: 600; }
  button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--ink); padding: 5px 12px; cursor: pointer; }
  button.primary { background: var(--ink); color: var(--panel); }
  button:disabled { opacity: .5; cursor: default; }
  .tabs { display: flex; gap: 4px; margin: 18px 0 0; border-bottom: 1px solid var(--ink); }
  .tabs button { border-bottom: none; background: transparent; }
  .tabs button.on { background: var(--ink); color: var(--panel); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); }
  th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  td.num { text-align: right; white-space: nowrap; }
  .reason { max-width: 420px; }
  .state { white-space: nowrap; }
  .badge { display: inline-block; padding: 1px 8px; border: 1px solid var(--ink); font-size: 13px; }
  .badge.ok { background: var(--ink); color: var(--panel); }
  .form { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .form input { font: inherit; padding: 4px 6px; border: 1px solid var(--ink); background: #fff; }
  .form input[type=number] { width: 90px; }
  .form input[type=text] { width: 200px; }
  .err { margin: 10px 0; padding: 8px 12px; border: 1px solid var(--ink); background: #e6c9c0; }
  tr.inactive td { color: var(--muted); }
  .skuform { background: var(--panel); border: 1px solid var(--line); padding: 12px 14px; margin: 12px 0; }
  .skuform label { display: block; margin: 6px 0 2px; font-size: 13px; color: var(--muted); }
  .skuform input[type=text], .skuform input[type=number], .skuform select { font: inherit; padding: 4px 6px; border: 1px solid var(--ink); background: #fff; width: 280px; max-width: 100%; }
  details { margin-top: 8px; }
  details ul { margin: 6px 0 0; padding-left: 20px; }
  .empty { padding: 14px; background: var(--panel); border: 1px solid var(--line); }
  @media (max-width: 700px) { .reason { max-width: none; } th:nth-child(2), td:nth-child(2) { display: none; } }
</style>
</head>
<body>
<main>
  <div class="bar">
    <div>
      <h1>Freshroots Demand Planning</h1>
      <div class="muted">The system informs. People decide. Nothing here places an order.</div>
      <div class="muted" style="margin-top:4px;font-size:13px"><a href="/deepa" style="color:inherit">Deepa's dashboard</a> (read-only view for the sponsor)</div>
    </div>
    <div>
      <button id="runNow" class="primary">Run now</button>
      <div class="muted" style="margin-top:4px;font-size:13px">Automatic runs: Mondays and Thursdays, about 8:00 am IST</div>
    </div>
  </div>

  <div id="error" class="err" hidden></div>
  <div id="header"></div>

  <div class="tabs">
    <button id="tabReview" class="on">Review</button>
    <button id="tabApproved">Approved list</button>
    <button id="tabSkus">SKUs</button>
    <button id="tabUpload">Upload SAP files</button>
  </div>

  <section id="review"></section>
  <section id="approved" hidden></section>
  <section id="skus" hidden></section>
  <section id="upload" hidden></section>
</main>

<script>
const LABEL = { 'high-demand': 'High demand', 'stockout-risk': 'Stockout risk', 'overstock-risk': 'Overstock risk' };
const ACTION = { 'reorder-now': 'Reorder now', 'pause-order': 'Pause next order' };
let state = null;
let openForm = null; // flag id whose override form is open

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (id) => document.getElementById(id);
const flagLabel = (types) => types.map((t) => LABEL[t] || t).join(' + ');
const fmtDate = (iso) => new Date(iso).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });

function showError(msg) {
  $('error').hidden = !msg;
  $('error').textContent = msg || '';
}

async function api(path, options) {
  const res = await fetch(path, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `Request failed (${res.status})`);
  return body;
}

async function load() {
  showError('');
  try {
    state = await api('/api/flags');
    render();
    if (!$('approved').hidden) await renderApproved();
  } catch (e) { showError(e.message); }
}

function renderHeader() {
  if (!state.run) {
    $('header').innerHTML = '<div class="empty">No run yet. Press <b>Run now</b> to check every SKU against the rules.</div>';
    return;
  }
  const r = state.run;
  const fest = r.festival_month === null ? 'unknown (month not in calendar)' : r.festival_month ? 'Yes' : 'No';
  const settings = state.settings.map((s) => `<li>${esc(s.description)}: <b>${esc(s.value)}</b></li>`).join('');
  $('header').innerHTML = `
    <div class="meta">
      <span>Run: <b>${esc(fmtDate(r.run_at))}</b> (${esc(r.triggered_by)})</span>
      <span>Stock as of: <b>${esc(r.as_of_date || 'n/a')}</b></span>
      <span>Festival month: <b>${esc(fest)}</b></span>
      <span>SKUs checked: <b>${state.skus_checked}</b></span>
      <span>No action: <b>${state.no_action_count}</b></span>
      <span>${zohoLine()}</span>
      <span>${uploadLine()}</span>
    </div>
    <details><summary>Active assumptions (to be confirmed with Raghav)</summary>
      <ul>${settings}
        <li>Perishable items (High) use the 3 and 4 week limits in place of the 6 and 14 week ones.</li>
        <li>The festival uplift applies to both the 12-week average and the last 4 weeks, before any check.</li>
        <li>The 12-week average is the last 12 weeks of sales, including the last 4.</li>
        <li>Overstock together with stockout or high demand goes to exceptions.</li>
        <li>Festival status comes from the month of the stock date, looked up in the calendar.</li>
      </ul>
    </details>`;
}

function stateCell(f) {
  if (f.decision) {
    const qty = f.decision === 'approved' ? f.recommended_qty : f.override_qty;
    const qtyText = qty === null ? 'no quantity given' : `qty ${qty}`;
    return `<span class="badge ok">${f.decision === 'approved' ? 'Approved' : 'Overridden'}</span>
      <div class="muted">${esc(qtyText)}${f.note ? ' · ' + esc(f.note) : ''}</div>`;
  }
  return '<span class="muted">Not decided</span>';
}

function buttonsCell(f) {
  if (openForm === f.id) {
    return `<div class="form">
      <input type="number" min="0" step="1" id="q${f.id}" placeholder="Quantity (optional)" value="${f.decision === 'overridden' && f.override_qty !== null ? f.override_qty : ''}">
      <input type="text" id="n${f.id}" maxlength="500" placeholder="Note (optional)" value="${esc(f.note || '')}">
      <button data-save="${f.id}" class="primary">Save override</button>
      <button data-cancel="${f.id}">Cancel</button>
    </div>`;
  }
  const approve = f.is_exception ? '' : `<button data-approve="${f.id}">Approve</button> `;
  return `${approve}<button data-override="${f.id}">Override</button>`;
}

function rowHtml(f) {
  const qty = f.recommended_qty === null ? '–' : f.recommended_qty;
  return `<tr>
    <td><b>${esc(f.sku_id)}</b></td>
    <td>${esc(f.sku_name)}</td>
    <td>${esc(f.recommended_action ? ACTION[f.recommended_action] : '–')}</td>
    <td class="num">${esc(qty)}</td>
    <td class="reason">${f.ai_reason
      ? `<div>${esc(f.ai_reason)}</div><div class="muted" style="font-size:12px;margin-top:4px">Calculation: ${esc(f.rule_reason)}</div>`
      : esc(f.rule_reason)}</td>
    <td>${onOrderCell(f)}</td>
    <td class="state">${stateCell(f)}</td>
    <td>${buttonsCell(f)}</td>
  </tr>`;
}

const HEAD = '<tr><th>SKU</th><th>Name</th><th>Action</th><th>Qty</th><th>Reason</th><th>Already on order</th><th>Decision</th><th></th></tr>';

const ZOHO_TEXT = { not_connected: 'Zoho not connected', never_synced: 'Not synced yet', failed: 'Zoho sync failed' };

function zohoLine() {
  const z = state.zoho;
  if (z.state === 'not_connected') return '<b>Zoho not connected</b>';
  if (z.state === 'never_synced') return '<b>Zoho not synced yet</b> (press Run now)';
  if (z.state === 'failed') {
    const good = z.last_ok_at ? `, last good sync ${esc(fmtDate(z.last_ok_at))}` : '';
    return `<b>Zoho sync failed</b>: ${esc(z.message || 'unknown error')}${good}`;
  }
  return `Zoho last synced <b>${esc(fmtDate(z.last_ok_at))}</b>`;
}

function uploadLine() {
  const u = state.last_upload;
  if (!u) return 'Data source: <b>sample data (no SAP upload yet)</b>';
  return `Last SAP upload: <b>${esc(fmtDate(u.uploaded_at))}</b> (${esc(u.sales_rows)} sales rows, ${esc(u.inventory_rows)} stock rows${u.orders_rows ? `, ${esc(u.orders_rows)} distributor-order rows${u.illustrative ? ' (illustrative demo data)' : ''}` : ''})`;
}

function onOrderCell(f) {
  if (state.zoho.state !== 'ok') return `<span class="muted">${esc(ZOHO_TEXT[state.zoho.state])}</span>`;
  if (!f.on_order.length) return '<span class="muted">None on order</span>';
  return f.on_order.map((o) => {
    const recv = o.quantity_received === null ? 'ordered' : `ordered, ${esc(o.quantity_received)} received`;
    return `<div><b>${esc(o.quantity)}</b> ${recv}<br><span class="muted">${esc(o.po_number || 'no PO number')} · ${esc(o.status)} · due ${esc(o.expected_date || 'date not given')}</span></div>`;
  }).join('');
}

function renderReview() {
  if (!state.run) { $('review').innerHTML = ''; return; }
  // Group by flag combination; groups in alphabetical order so no group reads as "first priority".
  const groups = new Map();
  for (const f of state.flagged) {
    const key = flagLabel([...f.flag_types].sort());
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(f);
  }
  let html = '<h2>Flagged SKUs</h2>';
  if (!groups.size) html += '<div class="empty">No SKU is flagged in this run.</div>';
  for (const key of [...groups.keys()].sort()) {
    html += `<h3>${esc(key)}</h3><table>${HEAD}${groups.get(key).map(rowHtml).join('')}</table>`;
  }
  html += '<h2>Exceptions</h2><div class="muted" style="margin-bottom:6px">The rules cannot decide these. Raghav decides, using Override.</div>';
  html += state.exceptions.length
    ? `<table>${HEAD}${state.exceptions.map(rowHtml).join('')}</table>`
    : '<div class="empty">No exceptions in this run.</div>';
  if (state.zoho.state === 'ok') {
    html += '<h2>Unmatched Zoho orders</h2><div class="muted" style="margin-bottom:6px">Open order lines whose Zoho item SKU code does not equal any SKU ID. They are never guessed.</div>';
    html += state.unmatched.length
      ? `<table><tr><th>PO</th><th>Status</th><th>Zoho item ID</th><th>Qty</th><th>Due</th></tr>${state.unmatched.map((o) => `<tr><td>${esc(o.po_number || '–')}</td><td>${esc(o.status)}</td><td>${esc(o.item_ref || '–')}</td><td class="num">${esc(o.quantity)}</td><td>${esc(o.expected_date || '–')}</td></tr>`).join('')}</table>`
      : '<div class="empty">None. Every open order line matched a SKU.</div>';
  }
  $('review').innerHTML = html;
}

function render() { renderHeader(); renderReview(); }

async function renderApproved() {
  try {
    const data = await api('/api/approved');
    let html = '<h2>Approved list for procurement</h2>';
    if (!data.rows.length) {
      html += '<div class="empty">Nothing approved yet in the latest run.</div>';
    } else {
      html += `<p><a href="/api/approved?format=csv"><button class="primary">Download CSV</button></a></p>
        <table><tr><th>SKU</th><th>Name</th><th>Flags</th><th>Decision</th><th>Final qty</th><th>Note</th></tr>
        ${data.rows.map((r) => `<tr><td><b>${esc(r.sku_id)}</b></td><td>${esc(r.sku_name)}</td><td>${esc(r.flags)}</td>
          <td>${esc(r.decision)}</td><td class="num">${r.final_qty === null ? '–' : esc(r.final_qty)}</td><td>${esc(r.note || '')}</td></tr>`).join('')}</table>`;
    }
    $('approved').innerHTML = html;
  } catch (e) { showError(e.message); }
}

async function decide(payload) {
  showError('');
  try {
    await api('/api/decide', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    openForm = null;
    await load();
  } catch (e) { showError(e.message); }
}

document.addEventListener('click', (ev) => {
  const t = ev.target;
  if (!(t instanceof HTMLElement)) return;
  if (t.dataset.approve) decide({ flag_id: Number(t.dataset.approve), decision: 'approved' });
  else if (t.dataset.override) { openForm = Number(t.dataset.override); renderReview(); }
  else if (t.dataset.cancel) { openForm = null; renderReview(); }
  else if (t.dataset.save) {
    const id = Number(t.dataset.save);
    decide({ flag_id: id, decision: 'overridden', override_qty: $('q' + id).value, note: $('n' + id).value });
  }
});

$('runNow').addEventListener('click', async () => {
  const b = $('runNow');
  b.disabled = true; b.textContent = 'Running…';
  showError('');
  try { await api('/api/run', { method: 'POST' }); openForm = null; await load(); }
  catch (e) { showError(e.message); }
  b.disabled = false; b.textContent = 'Run now';
});

function tab(which) {
  for (const t of ['review', 'approved', 'skus', 'upload']) {
    $(t).hidden = which !== t;
    $('tab' + t[0].toUpperCase() + t.slice(1)).classList.toggle('on', which === t);
  }
  if (which === 'approved') renderApproved();
  if (which === 'skus') renderSkus();
  if (which === 'upload') renderUpload();
}
$('tabReview').addEventListener('click', () => tab('review'));
$('tabApproved').addEventListener('click', () => tab('approved'));
$('tabSkus').addEventListener('click', () => tab('skus'));
$('tabUpload').addEventListener('click', () => tab('upload'));

// ---- SKUs ----
let skuData = null;
let skuForm = null; // null, { mode: 'add' } or { mode: 'edit', id }
let skuNote = '';

async function renderSkus() {
  try { skuData = await api('/api/skus'); } catch (e) { showError(e.message); return; }
  drawSkus();
}

function skuFormHtml() {
  const edit = skuForm.mode === 'edit';
  const s = edit ? skuData.skus.find((x) => x.sku_id === skuForm.id) : { sku_id: '', sku_name: '', category: '', perishability: 'Low', standard_reorder_qty: '', unit_of_measure: '', distributor_id: '' };
  const opts = skuData.distributors.map((d) => `<option value="${esc(d.distributor_id)}" ${d.distributor_id === s.distributor_id ? 'selected' : ''}>${esc(d.distributor_name)} (${esc(d.distributor_id)})</option>`).join('');
  return `<div class="skuform">
    <b>${edit ? 'Edit ' + esc(s.sku_id) : 'Add a SKU'}</b>
    <label>SKU ID ${edit ? '(cannot be changed)' : '(letters, digits, - and _)'}</label><input type="text" id="kId" maxlength="32" value="${esc(s.sku_id)}" ${edit ? 'disabled' : ''}>
    <label>Name</label><input type="text" id="kName" maxlength="120" value="${esc(s.sku_name)}">
    <label>Category</label><input type="text" id="kCat" maxlength="60" value="${esc(s.category)}">
    <label><input type="checkbox" id="kPer" ${s.perishability === 'High' ? 'checked' : ''}> Perishable (uses the 3 to 4 week stock window)</label>
    <label>Standard reorder quantity</label><input type="number" id="kQty" min="1" step="1" value="${esc(s.standard_reorder_qty)}">
    <label>Unit</label><input type="text" id="kUnit" maxlength="20" value="${esc(s.unit_of_measure)}">
    <label>Distributor</label><select id="kDist"><option value="">Choose…</option>${opts}</select>
    <div style="margin-top:10px"><button class="primary" id="kSave">${edit ? 'Save changes' : 'Add SKU'}</button> <button id="kCancel">Cancel</button></div>
    <div id="kErr"></div>
  </div>`;
}

function drawSkus() {
  const rows = skuData.skus.map((s) => {
    const id = esc(s.sku_id);
    const act = s.active ? `<button data-skudeact="${id}">Deactivate</button>` : `<button data-skuact="${id}">Reactivate</button>`;
    const hist = s.weeks_of_sales < 12 ? ` <span class="muted">(${s.weeks_of_sales} wk of sales)</span>` : '';
    return `<tr class="${s.active ? '' : 'inactive'}"><td><b>${id}</b></td><td>${esc(s.sku_name)}</td><td>${esc(s.category)}</td>
      <td>${s.perishability === 'High' ? 'Yes' : 'No'}</td><td class="num">${esc(s.standard_reorder_qty)}</td><td>${esc(s.unit_of_measure)}</td>
      <td>${esc(s.distributor_name || s.distributor_id)}</td>
      <td>${s.active ? '<span class="badge ok">Active</span>' : '<span class="badge">Inactive</span>'}${hist}</td>
      <td><button data-skuedit="${id}">Edit</button> ${act}</td></tr>`;
  }).join('');
  $('skus').innerHTML = `<h2>SKUs</h2>
    <p class="muted">Changes apply from the next run. A new SKU appears in the exceptions list until it has 12 weeks of sales. Deactivated SKUs are skipped by new runs and are never deleted.</p>
    ${skuNote ? `<div class="empty" style="margin-bottom:10px">${esc(skuNote)}</div>` : ''}
    ${skuForm ? skuFormHtml() : '<p><button class="primary" id="kAdd">Add a SKU</button></p>'}
    <table><tr><th>SKU</th><th>Name</th><th>Category</th><th>Perishable</th><th>Std qty</th><th>Unit</th><th>Distributor</th><th>Status</th><th></th></tr>${rows}</table>`;
}

async function skuCall(payload) {
  const res = await fetch('/api/skus', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  const body = await res.json().catch(() => ({}));
  return { ok: res.ok, body };
}

document.addEventListener('click', async (ev) => {
  const t = ev.target;
  if (!(t instanceof HTMLElement)) return;
  if (t.id === 'kAdd') { skuForm = { mode: 'add' }; skuNote = ''; drawSkus(); }
  else if (t.id === 'kCancel') { skuForm = null; drawSkus(); }
  else if (t.dataset.skuedit) { skuForm = { mode: 'edit', id: t.dataset.skuedit }; skuNote = ''; drawSkus(); }
  else if (t.dataset.skudeact || t.dataset.skuact) {
    const r = await skuCall({ action: t.dataset.skudeact ? 'deactivate' : 'reactivate', sku_id: t.dataset.skudeact || t.dataset.skuact });
    skuNote = r.ok ? r.body.note : (r.body.errors || [r.body.error]).join(' ');
    await renderSkus();
  } else if (t.id === 'kSave') {
    const edit = skuForm.mode === 'edit';
    const r = await skuCall({
      action: edit ? 'edit' : 'add', sku_id: edit ? skuForm.id : $('kId').value, sku_name: $('kName').value, category: $('kCat').value,
      perishable: $('kPer').checked, standard_reorder_qty: $('kQty').value, unit_of_measure: $('kUnit').value, distributor_id: $('kDist').value,
    });
    if (!r.ok) {
      $('kErr').innerHTML = `<div class="err"><b>Not saved.</b><ul>${(r.body.errors || [r.body.error || 'Something went wrong.']).map((e) => `<li>${esc(e)}</li>`).join('')}</ul></div>`;
      return;
    }
    skuForm = null; skuNote = r.body.note;
    await renderSkus();
  }
});

// ---- Upload SAP files ----
let uploadBuilt = false;
function renderUpload() {
  if (uploadBuilt) return;
  uploadBuilt = true;
  $('upload').innerHTML = `<h2>Upload SAP files</h2>
    <p class="muted">Choose the export IT sent. Weekly sales are added or corrected by SKU and week. A stock file replaces the whole current stock snapshot. Distributor orders are added or corrected by distributor and month, in units. Column names are to be confirmed with IT. Check first; nothing is saved until you press Load. After loading, press Run now to check every SKU against the new data.</p>
    <div class="form" style="flex-direction:column;align-items:flex-start;gap:10px">
      <label>Weekly sales CSV <input type="file" id="fSales" accept=".csv,text/csv"></label>
      <label>Current stock CSV <input type="file" id="fStock" accept=".csv,text/csv"></label>
      <label>Distributor monthly orders CSV (units; columns Distributor_ID, Month, Order_Volume) <input type="file" id="fOrders" accept=".csv,text/csv"></label>
      <label><input type="checkbox" id="fIll"> This orders file is <b>illustrative demo data</b>, not Freshroots data (it will be labelled on Deepa's page)</label>
      <label>Upload password <input type="password" id="fPw" autocomplete="off"></label>
      <div><button id="btnCheck">Check files</button> <button id="btnLoad" class="primary" disabled>Load into app</button> <button id="btnRemoveIll">Remove illustrative orders</button></div>
    </div>
    <div id="upResult" style="margin-top:12px"></div>`;
  const reset = () => { $('btnLoad').disabled = true; $('upResult').innerHTML = ''; };
  for (const id of ['fSales', 'fStock', 'fOrders', 'fIll', 'fPw']) $(id).addEventListener('input', reset);
  $('btnRemoveIll').addEventListener('click', removeIllustrative);
  $('btnCheck').addEventListener('click', () => uploadCall('check'));
  $('btnLoad').addEventListener('click', () => uploadCall('load'));
}

async function removeIllustrative() {
  const out = $('upResult');
  if (!window.confirm('Remove every distributor-order row that was uploaded labelled illustrative? Real order rows are not touched.')) return;
  try {
    const res = await fetch('/api/upload', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Upload-Password': $('fPw').value }, body: JSON.stringify({ mode: 'remove_illustrative' }) });
    const body = await res.json().catch(() => ({}));
    out.innerHTML = res.ok ? `<div class="empty">Removed <b>${esc(body.removed)}</b> illustrative order row(s).</div>` : `<div class="err">${esc(body.error || (body.errors || ['Failed']).join(' '))}</div>`;
  } catch (e) { out.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

async function uploadCall(mode) {
  const out = $('upResult');
  const sales = $('fSales').files[0], stock = $('fStock').files[0], orders = $('fOrders').files[0];
  $('btnCheck').disabled = true; $('btnLoad').disabled = true;
  try {
    const res = await fetch('/api/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Upload-Password': $('fPw').value },
      body: JSON.stringify({ mode, sales: sales ? await sales.text() : '', inventory: stock ? await stock.text() : '', orders: orders ? await orders.text() : '', illustrative: $('fIll').checked }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      const list = body.errors || [body.error || `Upload failed (${res.status})`];
      out.innerHTML = `<div class="err"><b>${mode === 'load' ? 'Nothing was loaded.' : 'Not loaded.'}</b><ul>${list.map((e) => `<li>${esc(e)}</li>`).join('')}</ul></div>`;
      return;
    }
    const s = body.summary, lines = [];
    if (s.sales_rows) lines.push(`Sales: <b>${s.sales_rows}</b> rows, weeks ${esc(s.weeks_from)} to ${esc(s.weeks_to)}: <b>${s.sales_new}</b> new, <b>${s.sales_corrected}</b> corrected.`);
    if (s.inventory_rows) lines.push(`Stock: <b>${s.inventory_rows}</b> rows as of ${esc(s.as_of_dates.join(', '))}. This replaces the current stock snapshot.`);
    if (s.orders_rows) lines.push(`Distributor orders: <b>${s.orders_rows}</b> rows, months ${esc(s.orders_from)} to ${esc(s.orders_to)}: <b>${s.orders_new}</b> new, <b>${s.orders_corrected}</b> corrected. ${s.illustrative ? '<b>Labelled illustrative demo data, not Freshroots data.</b>' : 'Not labelled illustrative, so this is treated as real Freshroots data.'}`);
    if (s.skus_missing_stock.length) lines.push(`<b>No stock row for:</b> ${esc(s.skus_missing_stock.join(', '))}. These SKUs will go to exceptions as missing stock data.`);
    if (body.loaded) {
      out.innerHTML = `<div class="empty"><b>Loaded.</b><br>${lines.join('<br>')}<br>Press <b>Run now</b> to check every SKU against this data.</div>`;
      await load();
    } else {
      out.innerHTML = `<div class="empty"><b>Checked, nothing saved yet.</b><br>${lines.join('<br>')}</div>`;
      $('btnLoad').disabled = false;
    }
  } catch (e) {
    out.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  } finally {
    $('btnCheck').disabled = false;
  }
}

load();
</script>
</body>
